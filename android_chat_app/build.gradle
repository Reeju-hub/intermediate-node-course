// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '7.3.0' apply false // Check for latest stable
    id 'com.android.library' version '7.3.0' apply false // Check for latest stable
    id 'org.jetbrains.kotlin.android' version '1.7.20' apply false // Check for latest stable, compatible with AGP
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
